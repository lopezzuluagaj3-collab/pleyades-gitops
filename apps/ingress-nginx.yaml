# ---------------------------------------------------------
# Proyecto Pléyades - ArgoCD Child Application: Ingress NGINX
# ---------------------------------------------------------
# Despliega el Ingress Controller oficial de NGINX mediante
# el Helm Chart oficial en el namespace 'ingress-nginx'.
# Aprovisiona el Azure Public LoadBalancer con etiqueta DNS.
# ---------------------------------------------------------
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ingress-nginx
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: 'https://kubernetes.github.io/ingress-nginx'
    chart: ingress-nginx
    targetRevision: '4.11.3'
    helm:
      values: |
        controller:
          replicaCount: 1
          service:
            annotations:
              service.beta.kubernetes.io/azure-dns-label-name: pleyades-sre
              service.beta.kubernetes.io/azure-load-balancer-health-probe-request-path: /healthz
          metrics:
            enabled: true
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 300m
              memory: 256Mi
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: ingress-nginx
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ApplyOutOfSyncOnly=true
