apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: pleyades-app-ingress
  namespace: pleyades-app
  annotations:
    ingress.kubernetes.io/ssl-redirect: "false"
spec:
  ingressClassName: nginx
  rules:
    - host: app.74.155.178.179.nip.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: pleyades-app-service
                port:
                  number: 8080
    - host: pleyades-sre.eastus2.cloudapp.azure.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: pleyades-app-service
                port:
                  number: 8080
