apiVersion: batch/v1
kind: Job
metadata:
  name: k6-load-test
  namespace: pleyades-app
  labels:
    app.kubernetes.io/name: k6-load-test
    app.kubernetes.io/part-of: pleyades-platform
spec:
  ttlSecondsAfterFinished: 600
  backoffLimit: 0
  template:
    metadata:
      labels:
        app: k6-load-test
    spec:
      restartPolicy: Never
      containers:
        - name: k6
          image: grafana/k6:0.56.0
          args:
            - "run"
            - "/scripts/load_test.js"
          env:
            - name: TARGET_URL
              value: "http://pleyades-app-service.pleyades-app.svc.cluster.local:8080"
          volumeMounts:
            - name: k6-scripts
              mountPath: /scripts
          resources:
            requests:
              cpu: 200m
              memory: 128Mi
            limits:
              cpu: 1000m
              memory: 512Mi
      volumes:
        - name: k6-scripts
          configMap:
            name: k6-test-scripts
