apiVersion: apps/v1
kind: Deployment
metadata:
  name: pleyades-app
  namespace: pleyades-app
  labels:
    app.kubernetes.io/name: pleyades-app
    app.kubernetes.io/part-of: pleyades-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: pleyades-app
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pleyades-app
        app.kubernetes.io/part-of: pleyades-platform
    spec:
      serviceAccountName: pleyades-app-sa
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: ghcr.io/lopezzuluagaj3-collab/pleyades-app:68c41507449c8da124b9d4be85af1d3e1a73905f
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          envFrom:
            - configMapRef:
                name: pleyades-app-config
            - secretRef:
                name: pleyades-app-secret
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 2
