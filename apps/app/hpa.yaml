apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: pleyades-app-hpa
  namespace: pleyades-app
  labels:
    app.kubernetes.io/name: pleyades-app
    app.kubernetes.io/part-of: pleyades-platform
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: pleyades-app
  minReplicas: 3
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
